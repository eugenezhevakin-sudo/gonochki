name: Build APEX GRID Track Lab Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Godot 4.4.1 · verify 23 tracks · Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out public test project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate circuit atlas without engine
        run: python3 tools/check_atlas.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35 and build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download official Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/godotengine/godot/releases/download/4.4.1-stable'
          curl --fail --location --retry 3 -o /tmp/godot.zip "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 -o /tmp/godot.tpz "$BASE/Godot_v4.4.1-stable_export_templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$DEST"
          for name in android_debug.apk android_release.apk version.txt; do
            unzip -p /tmp/godot.tpz "templates/$name" > "$DEST/$name"
            test -s "$DEST/$name"
          done
          rm -f /tmp/godot.zip /tmp/godot.tpz
          godot --version

      - name: Prepare debug signing and Godot editor paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=APEX GRID Track Lab,O=APEX,C=US' -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project and compile all GDScript
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/godot-import.log; then
            exit 1
          fi

      - name: Verify 23 procedural 3D tracks with physical road/pit surfaces
        shell: bash
        run: timeout --signal=TERM --kill-after=10s 180s godot --headless --path . --script res://tests/atlas_smoke.gd

      - name: Verify track picker, 2D/3D modes, test-drive and Android controls
        shell: bash
        run: timeout --signal=TERM --kill-after=10s 120s godot --headless --path . --script res://tests/ui_smoke.gd

      - name: Export and verify debug-signed Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER='androiddebugkey'
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD='android'
          godot --headless --path . --export-debug Android build/APEX_GRID_Track_Lab_23_Debug.apk
          test -s build/APEX_GRID_Track_Lab_23_Debug.apk
          unzip -t build/APEX_GRID_Track_Lab_23_Debug.apk | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/APEX_GRID_Track_Lab_23_Debug.apk
          sha256sum build/APEX_GRID_Track_Lab_23_Debug.apk | tee build/APEX_GRID_Track_Lab_23_Debug.apk.sha256

      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: APEX-GRID-Track-Lab-Android-APK
          path: |
            build/APEX_GRID_Track_Lab_23_Debug.apk
            build/APEX_GRID_Track_Lab_23_Debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish separate prerelease for one-click APK download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="track-lab-test-${{ github.run_number }}"
          gh release create "$TAG" \
            build/APEX_GRID_Track_Lab_23_Debug.apk \
            build/APEX_GRID_Track_Lab_23_Debug.apk.sha256 \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APEX GRID Track Lab · 23 track prototype #${{ github.run_number }}" \
            --notes "Standalone geometry experiment: 23 circuits, 2D diagrams, 3D physical road and pit mesh, mobile test-drive car. NOT the private full 22-car racing game; circuit geometry and pit joins are still unverified."
          gh release view "$TAG" --repo "${{ github.repository }}" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
